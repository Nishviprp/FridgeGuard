[build]
  command       = "npm run build"
  publish       = "dist"

[functions]
  directory        = "netlify/functions"
  node_bundler     = "esbuild"
  included_files   = ["netlify/functions/_lib/**"]

# ── Scheduled functions (cron) ────────────────────────────────────────────────
# Both run daily at 8:00 AM UTC.
# Netlify Background Functions required for scheduled tasks:
#   https://docs.netlify.com/functions/scheduled-functions/

[functions."send-expiry-emails"]
  schedule = "@daily"

[functions."send-push-notifications"]
  schedule = "@daily"

# ── API redirects ─────────────────────────────────────────────────────────────
# IMPORTANT: order matters — most specific paths must come first.

[[redirects]]
  from   = "/api/items/:id/consume"
  to     = "/.netlify/functions/items-consume"
  status = 200

[[redirects]]
  from   = "/api/items/:id"
  to     = "/.netlify/functions/items-id"
  status = 200

[[redirects]]
  from   = "/api/items"
  to     = "/.netlify/functions/items"
  status = 200

[[redirects]]
  from   = "/api/parse"
  to     = "/.netlify/functions/parse"
  status = 200

[[redirects]]
  from   = "/api/settings"
  to     = "/.netlify/functions/settings"
  status = 200

[[redirects]]
  from   = "/api/notifications"
  to     = "/.netlify/functions/notifications"
  status = 200

[[redirects]]
  from   = "/api/stats"
  to     = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from   = "/api/push-subscription"
  to     = "/.netlify/functions/push-subscription"
  status = 200

[[redirects]]
  from   = "/api/test-notifications"
  to     = "/.netlify/functions/test-notifications"
  status = 200

[[redirects]]
  from   = "/api/unsubscribe"
  to     = "/.netlify/functions/unsubscribe"
  status = 200

# ── SPA catch-all — must be LAST ──────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
